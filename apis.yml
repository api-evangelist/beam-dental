name: Beam Dental
description: 'Beam Dental (Beam Benefits) is an employee benefits provider offering dental, vision, life,
  disability, and supplemental health coverage (accident, hospital indemnity, and critical illness) to
  brokers, employers, and members. The company streamlines benefits administration with digital quoting,
  self-service member, broker, and provider portals, and fast group implementation. Beam is backed by Kleiner
  Perkins. As of this enrichment pass Beam publishes no public developer portal, API documentation, or
  machine-readable API specification; its digital surface is a set of login-gated member, broker/employer
  (Lighthouse), and provider web applications.'
